name: Update Plan
on:
  push:
    branches: [main]
    paths:
      - "transcripts/**"
  workflow_dispatch:
jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - name: Rebuild Plan tab
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: python scripts/update_plan.py
